<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta
      name="description"
      content="Way2Cure: care at home, now with everything seniors need. Nurses, doctors and ICU care at home, plus medicines, devices and daily care delivered across Mumbai, Navi Mumbai and Thane."
    />
    <link rel="icon" type="image/png" href="/logo.png" />
    <!-- Self-hosted fonts (src/styles/fonts.css). Preload the two every page uses first. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/lora-normal-700-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/nunito-sans-normal-400-latin.woff2" crossorigin />
    <script>
      // Homepage only: start loading the hero photo while the app code downloads (faster LCP).
      if (location.pathname === '/') {
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.fetchPriority = 'high';
        l.setAttribute('imagesrcset', '/images/people/elderly-couple-smiling-sm.webp 440w, /images/people/elderly-couple-smiling.webp 720w');
        l.setAttribute('imagesizes', '(min-width: 1024px) 424px, 270px');
        document.head.appendChild(l);
      }
    </script>
    <title>Way2Cure | Home care & senior marketplace in Mumbai</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
